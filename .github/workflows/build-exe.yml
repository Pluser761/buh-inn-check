name: Build exe

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CheckINN gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: CheckINN
          path: dist/CheckINN.exe

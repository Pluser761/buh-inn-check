name: Build exe

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CheckINN gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: CheckINN
          path: dist/CheckINN.exe

  release:
    needs: build
    # Релиз только из master или по тегу v*
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CheckINN
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Сборка {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: CheckINN.exe
